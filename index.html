  <body>
    <!-- navbar  -->

    <nav class="navbar">
      <div class="colorContainer">
        <p
          class="red"
          style="background-color: red; height: 6vh; width: 23%"
        ></p>
        <p
          class="green"
          style="background-color: green; height: 6vh; width: 23%"
        ></p>
        <p
          class="blue"
          style="background-color: blue; height: 6vh; width: 23%"
        ></p>
        <p
          class="orange"
          style="background-color: orange; height: 6vh; width: 23%"
        ></p>
      </div>
      <div>
        <!-- add button -->

        <div class="iconNavContainer">
          <svg
            class="addBtn"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            width="24"
            height="24"
          >
            <path

            ></path>
          </svg>

          <!-- delete button -->

          <svg
            class="deleteBtn"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            width="24"
            height="24"
          >
            <path
              d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"
            ></path>
          </svg>
        </div>
      </div>
    </nav>
